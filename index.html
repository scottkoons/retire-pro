<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Defense-in-depth: the only third-party origins are the two AI providers,
         and connect-src is the ONLY directive that admits them (no scripts, no
         styles, no frames). style 'unsafe-inline' is required by Recharts/react-pdf;
         'wasm-unsafe-eval' + connect-src data: let react-pdf load its bundled
         WebAssembly; blob: covers the PDF/backup downloads and the MC worker. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob: ws: wss: https://api.anthropic.com https://api.openai.com; worker-src 'self' blob:; object-src 'none'; base-uri 'none'"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Lets Chrome install this as a standalone desktop app (own window and
         dock icon, no tab strip) rather than a generic page shortcut. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0d1420" />
    <title>RetirePro</title>
    <meta name="description" content="Private local retirement planner" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
